name: "🔨 Build All Services"

# Workflow này dùng để build TẤT CẢ services cùng lúc (khi cần)
# Mỗi service riêng lẻ đã có workflow riêng (ci-*.yml) chạy tự động khi code thay đổi

on:
  workflow_dispatch:

jobs:
  security-audit:
    uses: ./.github/workflows/reusable-security-scan.yml
    secrets: inherit

  build-api-gateway:
    needs: security-audit
    uses: ./.github/workflows/reusable-build-push.yml
    with:
      service_name: "API Gateway"
      context_path: "services/apigateway"
      image_name: "hiamchubbybear/psyconnect-api-gateway"
      registry: "docker.io"
      username: "hiamchubbybear"
    secrets:
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  build-identity-service:
    needs: security-audit
    uses: ./.github/workflows/reusable-build-push.yml
    with:
      service_name: "Identity Service"
      context_path: "services/identityservice"
      image_name: "hiamchubbybear/psyconnect-identity-service"
      registry: "docker.io"
      username: "hiamchubbybear"
    secrets:
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  build-profile-service:
    needs: security-audit
    uses: ./.github/workflows/reusable-build-push.yml
    with:
      service_name: "Profile Service"
      context_path: "services/profileservice"
      image_name: "hiamchubbybear/psyconnect-profile-service"
      registry: "docker.io"
      username: "hiamchubbybear"
    secrets:
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  build-consultation-service:
    needs: security-audit
    uses: ./.github/workflows/reusable-build-push.yml
    with:
      service_name: "Consultation Service"
      context_path: "services/consultationservice"
      image_name: "hiamchubbybear/psyconnect-consultation-service"
      registry: "docker.io"
      username: "hiamchubbybear"
    secrets:
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  build-chat-service:
    needs: security-audit
    uses: ./.github/workflows/reusable-build-push.yml
    with:
      service_name: "Chat Service"
      context_path: "services/chatservice"
      image_name: "hiamchubbybear/psyconnect-chat-service"
      registry: "docker.io"
      username: "hiamchubbybear"
    secrets:
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  build-notification-service:
    needs: security-audit
    uses: ./.github/workflows/reusable-build-push.yml
    with:
      service_name: "Notification Service"
      context_path: "services/notificationservice"
      image_name: "hiamchubbybear/psyconnect-notification-service"
      registry: "docker.io"
      username: "hiamchubbybear"
    secrets:
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  build-webapp:
    needs: security-audit
    uses: ./.github/workflows/reusable-build-push.yml
    with:
      service_name: "Web App"
      context_path: "services/webapp/psyconnect-web"
      image_name: "hiamchubbybear/psyconnect-webapp"
      registry: "docker.io"
      username: "hiamchubbybear"
      docker_build_args: "--build-arg CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }} --build-arg CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}"
    secrets:
      password: ${{ secrets.DOCKERHUB_TOKEN }}
