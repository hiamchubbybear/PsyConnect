name: "🔄 PsyConnect CI/CD Pipeline"

on:
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

jobs:
  # ╔══════════════════════════════════════════╗
  # ║  PHASE 1: 🔒 Security Scan              ║
  # ╚══════════════════════════════════════════╝
  security-scan:
    name: "🔒 Security Scan"
    uses: ./.github/workflows/reusable-security-scan.yml
    secrets: inherit

  # ╔══════════════════════════════════════════╗
  # ║  PHASE 2: ☕ Build Java Backend          ║
  # ╚══════════════════════════════════════════╝
  build-api-gateway:
    name: "🌐 API Gateway"
    needs: security-scan
    uses: ./.github/workflows/reusable-build-push.yml
    with:
      service_name: "API Gateway"
      context_path: "services/apigateway"
      image_name: "hiamchubbybear/psyconnect-api-gateway"
      registry: "docker.io"
      username: "hiamchubbybear"
    secrets:
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  build-identity-service:
    name: "🔑 Identity Service"
    needs: security-scan
    uses: ./.github/workflows/reusable-build-push.yml
    with:
      service_name: "Identity Service"
      context_path: "services/identityservice"
      image_name: "hiamchubbybear/psyconnect-identity-service"
      registry: "docker.io"
      username: "hiamchubbybear"
    secrets:
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  build-profile-service:
    name: "👤 Profile Service"
    needs: security-scan
    uses: ./.github/workflows/reusable-build-push.yml
    with:
      service_name: "Profile Service"
      context_path: "services/profileservice"
      image_name: "hiamchubbybear/psyconnect-profile-service"
      registry: "docker.io"
      username: "hiamchubbybear"
    secrets:
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  # ╔══════════════════════════════════════════╗
  # ║  PHASE 3: 🔧 Build Go + Specialized     ║
  # ╚══════════════════════════════════════════╝
  build-consultation-service:
    name: "🩺 Consultation Service"
    needs: [build-api-gateway, build-identity-service, build-profile-service]
    uses: ./.github/workflows/reusable-build-push.yml
    with:
      service_name: "Consultation Service"
      context_path: "services/consultationservice"
      image_name: "hiamchubbybear/psyconnect-consultation-service"
      registry: "docker.io"
      username: "hiamchubbybear"
    secrets:
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  build-chat-service:
    name: "💬 Chat Service"
    needs: [build-api-gateway, build-identity-service, build-profile-service]
    uses: ./.github/workflows/reusable-build-push.yml
    with:
      service_name: "Chat Service"
      context_path: "services/chatservice"
      image_name: "hiamchubbybear/psyconnect-chat-service"
      registry: "docker.io"
      username: "hiamchubbybear"
    secrets:
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  build-notification-service:
    name: "🔔 Notification Service"
    needs: [build-api-gateway, build-identity-service, build-profile-service]
    uses: ./.github/workflows/reusable-build-push.yml
    with:
      service_name: "Notification Service"
      context_path: "services/notificationservice"
      image_name: "hiamchubbybear/psyconnect-notification-service"
      registry: "docker.io"
      username: "hiamchubbybear"
    secrets:
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  # ╔══════════════════════════════════════════╗
  # ║  PHASE 4: 🖥️ Build Frontend              ║
  # ╚══════════════════════════════════════════╝
  build-webapp:
    name: "🖥️ Webapp"
    needs:
      [
        build-consultation-service,
        build-chat-service,
        build-notification-service,
      ]
    uses: ./.github/workflows/reusable-build-push.yml
    with:
      service_name: "Web App"
      context_path: "services/webapp/psyconnect-web"
      image_name: "hiamchubbybear/psyconnect-webapp"
      registry: "docker.io"
      username: "hiamchubbybear"
      docker_build_args: "--build-arg CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }} --build-arg CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}"
    secrets:
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  # ╔══════════════════════════════════════════╗
  # ║  PHASE 5: 🚀 Deploy to K3s              ║
  # ╚══════════════════════════════════════════╝
  deploy:
    name: "🚀 Deploy to K3s"
    needs: [build-webapp]
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      CHAT_MONGO_URI: ${{ secrets.CHAT_MONGO_URI }}
      CONSULTATION_MONGO_URI: ${{ secrets.CONSULTATION_MONGO_URI }}
      SPRING_NEO4J_AUTHENTICATION_USERNAME: ${{ secrets.SPRING_NEO4J_AUTHENTICATION_USERNAME }}
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: ${{ secrets.SPRING_NEO4J_AUTHENTICATION_PASSWORD }}
      CONSULTATION_REDIS_PASSWORD: ${{ secrets.CONSULTATION_REDIS_PASSWORD }}
      SPRING_DATA_REDIS_PASSWORD: ${{ secrets.SPRING_DATA_REDIS_PASSWORD }}
      SIGNER_KEY: ${{ secrets.SIGNER_KEY }}
      JWT_SIGNER_KEY: ${{ secrets.JWT_SIGNER_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
      FACEBOOK_CLIENT_ID: ${{ secrets.SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_FACEBOOK_CLIENT_ID }}
      FACEBOOK_CLIENT_SECRET: ${{ secrets.SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_FACEBOOK_CLIENT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET }}
      SMPT_HOST: ${{ secrets.SMPT_HOST }}
      SMPT_PORT: ${{ secrets.SMPT_PORT }}
      SMPT_MAIL: ${{ secrets.SMPT_MAIL }}
      SMPT_APP_PASS: ${{ secrets.SMPT_APP_PASS }}
