name: Reusable Security Scan

on:
  workflow_call:

jobs:
  scan:
    runs-on: self-hosted
    steps:
      - name: Cleanup stale temp files
        run: rm -f /tmp/gitleaks.tmp

      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
