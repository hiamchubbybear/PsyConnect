name: Reusable Security Scan

on:
  workflow_call:

jobs:
  scan:
    runs-on: self-hosted
    steps:
      - name: Cleanup stale temp files
        run: rm -f /tmp/gitleaks.tmp /tmp/gitleaks.tar.gz

      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_BIN="$HOME/.local/bin/gitleaks"
          mkdir -p "$HOME/.local/bin"
          if [ ! -f "$GITLEAKS_BIN" ]; then
            curl -sSfL https://github.com/zricethezav/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
            tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
            rm /tmp/gitleaks.tar.gz
          fi
          $GITLEAKS_BIN version

      - name: Run Gitleaks Scan
        run: |
          $HOME/.local/bin/gitleaks detect --source . --verbose --no-banner || true
          echo "Security scan completed"
