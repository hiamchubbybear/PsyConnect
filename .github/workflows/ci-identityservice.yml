name: CI - Identity Service

on:
  push:
    branches: ["cicd"]
    paths:
      - 'services/identityservice/**'
      - 'services/grpccommon/**'
      - 'services/pom.xml'
      - '.github/workflows/ci-identityservice.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: hiamchubbybear
          password: dckr_pat_LTuO4LaeRlB2Q3JCxLMKRKdG-Rs

      - name: Build & Push Identity Service
        run: |
          echo "Building Identity Service..."
          docker build -f ./services/identityservice/Dockerfile -t hiamchubbybear/identityservice:latest .
          docker push hiamchubbybear/identityservice:latest
          echo "Identity Service build complete"
