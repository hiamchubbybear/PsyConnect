name: CI - Notification Service

on:
  push:
    branches: ["cicd"]
    paths:
      - 'services/notificationservice/**'
      - '.github/workflows/ci-notificationservice.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: hiamchubbybear
          password: dckr_pat_LTuO4LaeRlB2Q3JCxLMKRKdG-Rs

      - name: Build & Push Notification Service
        run: |
          echo "Building Notification Service..."
          docker build -f ./services/notificationservice/Dockerfile -t hiamchubbybear/notificationservice:latest .
          docker push hiamchubbybear/notificationservice:latest
          echo "Notification Service build complete"
