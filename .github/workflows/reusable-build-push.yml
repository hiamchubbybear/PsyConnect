name: Reusable Build and Push

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      context_path:
        required: true
        type: string
      image_name:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: "Dockerfile"
      registry:
        required: false
        type: string
        default: "docker.io"
      username:
        required: true
        type: string
    secrets:
      password:
        required: true
      CLOUDINARY_API_KEY:
        required: false
      CLOUDINARY_API_SECRET:
        required: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.username }}
          password: ${{ secrets.password }}

      - name: Set up JDK 21
        if: ${{ hashFiles(format('{0}/mvnw', inputs.context_path)) != '' }}
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Install Common Dependencies (grpccommon)
        if: ${{ hashFiles(format('{0}/mvnw', inputs.context_path)) != '' }}
        run: |
          if [ -f "services/grpccommon/pom.xml" ]; then
            cd services
            mvn -N clean install
            cd grpccommon
            mvn clean install -DskipTests
          fi

      - name: Build with Maven
        if: ${{ hashFiles(format('{0}/mvnw', inputs.context_path)) != '' }}
        run: |
          cd ${{ inputs.context_path }}
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Build and Push ${{ inputs.service_name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context_path }}
          file: ${{ inputs.context_path }}/${{ inputs.dockerfile }}
          push: true
          tags: ${{ inputs.registry }}/${{ inputs.image_name }}:latest
          build-args: |
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
