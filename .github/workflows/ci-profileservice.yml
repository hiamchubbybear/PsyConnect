name: CI - Profile Service

on:
  push:
    branches: ["cicd"]
    paths:
      - 'services/profileservice/**'
      - 'services/grpccommon/**'
      - 'services/pom.xml'
      - '.github/workflows/ci-profileservice.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: hiamchubbybear
          password: dckr_pat_LTuO4LaeRlB2Q3JCxLMKRKdG-Rs

      - name: Build & Push Profile Service
        run: |
          echo "Building Profile Service..."
          docker build -f ./services/profileservice/Dockerfile -t hiamchubbybear/profileservice:latest .
          docker push hiamchubbybear/profileservice:latest
          echo "Profile Service build complete"
