name: Build & Push Services

on:
  push:
    branches: ["cicd"]
    environment: secrets

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Services
        run: |
          services=("apigateway" "consultationservice" "identityservice" "notificationservice" "profileservice")

          for service in "${services[@]}"; do
            echo "🚀 Building $service"
            docker build -t hiamchubbybear/$service:latest services/$service
            docker push hiamchubbybear/$service:latest
            echo "Done."
          done
