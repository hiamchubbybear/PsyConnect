version: "3.8"

services:
  # Infrastructure
  redis:
    image: redis:7-alpine
    container_name: psyconnect-redis-dev
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - default

  zookeeper:
    image: zookeeper:latest
    container_name: psyconnect-zookeeper-dev
    ports:
      - "2181:2181"
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    restart: unless-stopped
    networks:
      - default

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: psyconnect-kafka-dev
    ports:
      - "19092:29094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9094,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094,PLAINTEXT_HOST://0.0.0.0:29094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    restart: unless-stopped
    networks:
      - default

  loki:
    image: grafana/loki:2.9.3
    container_name: psyconnect-loki-dev
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    restart: unless-stopped
    networks:
      - default

  grafana:
    image: grafana/grafana:10.3.1
    container_name: psyconnect-grafana-dev
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=16032004
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ../services/loggingservice/grafana/provisioning:/etc/grafana/provisioning
      - ../services/loggingservice/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped
    networks:
      - default

  prometheus:
    image: prom/prometheus:latest
    container_name: psyconnect-prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - ../services/loggingservice/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped
    networks:
      - default

  tempo:
    image: grafana/tempo:latest
    container_name: psyconnect-tempo-dev
    user: "0"
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../services/loggingservice/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/tmp/tempo
    restart: unless-stopped
    networks:
      - default

  dozzle:
    image: amir20/dozzle:latest
    container_name: psyconnect-dozzle-dev
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - default

  # Application Services
  apigateway:
    build:
      context: ../services/apigateway
      dockerfile: Dockerfile
    container_name: psyconnect-apigateway-dev
    ports:
      - "8888:8888"
    environment:
      - BOOTSTRAP_ADDRESS=kafka:9094
      - SPRING_PROFILES_ACTIVE=cicd
    depends_on:
      - kafka
      - identityservice
    networks:
      - default
    restart: unless-stopped

  identityservice:
    build:
      context: ../services/identityservice
      dockerfile: Dockerfile
    container_name: psyconnect-identityservice-dev
    ports:
      - "8080:8080"
    environment:
      - BOOTSTRAP_ADDRESS=kafka:9094
      - spring.kafka.bootstrap-servers=kafka:9094
      - SPRING_PROFILES_ACTIVE=cicd
      - baseUriNotificationService=notificationservice
      - baseUriProfileService=profileservice
    env_file:
      - .env
    depends_on:
      - kafka
    networks:
      - default
    restart: unless-stopped

  profileservice:
    build:
      context: ../services/profileservice
      dockerfile: Dockerfile
    container_name: psyconnect-profileservice-dev
    ports:
      - "8081:8081"
      - "50051:50051"
    environment:
      - BOOTSTRAP_ADDRESS=kafka:9094
      - SPRING_PROFILES_ACTIVE=cicd
      - spring.kafka.bootstrap-servers=kafka:9094
      - GRPC_SERVER_PORT=50051
    env_file:
      - .env
    depends_on:
      - kafka
    networks:
      - default
    restart: unless-stopped

  notificationservice:
    build:
      context: ../services/notificationservice
      dockerfile: Dockerfile
    container_name: psyconnect-notificationservice-dev
    ports:
      - "8082:8082"
    environment:
      - KAFKA_BROKER=kafka:9094
      - PORT=8082
    env_file:
      - .env
    depends_on:
      - kafka
    networks:
      - default
    restart: unless-stopped

  chatservice:
    build:
      context: ../services/chatservice
      dockerfile: Dockerfile
    container_name: psyconnect-chatservice-dev
    ports:
      - "8083:8083"
    environment:
      - SERVICE_PORT=8083
      - SERVICE_HOST=0.0.0.0
      - DB_NAME=chatservice
      - MONGO_URI=mongodb+srv://tranvanhuy12_db_user:nu3xNZ9crMC4xrjv@cluster0.bbfwgos.mongodb.net/chatservice
      - KAFKA_ADDRESS=kafka:9094
      - KAFKA_TOPIC=chat_topic
      - KAFKA_NOTIFICATION_TOPIC=notification_topic
      - GRPC_ADDRESS=profileservice:50051
      - JWT_SIGNER_
      - ENVIRONMENT=dev
    depends_on:
      - kafka
    networks:
      - default
    restart: unless-stopped

  consultationservice:
    build:
      context: ../services/consultationservice
      dockerfile: Dockerfile
    container_name: psyconnect-consultationservice-dev
    ports:
      - "8084:8084"
    environment:
      - KAFKA_BROKERS=kafka:9094
      - ENVIRONMENT=dev
      - DB_NAME=consultationservice
      - MONGO_URI=mongodb+srv://tranvanhuy12_db_user:nu3xNZ9crMC4xrjv@cluster0.bbfwgos.mongodb.net/consultationservice
      - JWT_SIGNER_
      - CONSULTATION_REDIS_ADDRESS=redis:6379
      - SERVICE_PORT=8084
      - SERVICE_HOST=0.0.0.0
      - KAFKA_ADDRESS=kafka:9094
      - KAFKA_TOPIC=consultation.test
      - KAFKA_PARTITION=0
      - KAFKA_NOTIFICATION_TOPIC=notification.test
      - PROFILE_GRPC_ADDR=profileservice:50051
    depends_on:
      - kafka
      - redis
      - profileservice
    networks:
      - default
    restart: unless-stopped

  logging-service-app:
    build:
      context: ../services/loggingservice
      dockerfile: Dockerfile
    container_name: psyconnect-loggingservice-app-dev
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - KAFKA_GROUP_ID=logging-service
      - KAFKA_TOPIC=logging-service
      - LOKI_ENABLED=true
      - LOKI_URL=http://loki:3100
      - FILE_LOGGER_ENABLED=false
      - SERVER_PORT=8889
      - ENVIRONMENT=development
    ports:
      - "8889:8889"
    depends_on:
      - kafka
      - loki
    networks:
      - default
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: psyconnect-kafka-ui-dev
    ports:
      - "8090:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=psyconnect-dev
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9094
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
    depends_on:
      - kafka
      - zookeeper
    networks:
      - default
    restart: unless-stopped

networks:
  default:
    name: psyconnect-dev

volumes:
  loki-data:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local
  tempo-data:
    driver: local
