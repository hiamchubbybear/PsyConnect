version: '3.8'

services:

  apigateway:
    build:
      context: .
      dockerfile: ./apigateway/Dockerfile
    container_name: apigateway
    ports:
      - "8888:8888"
    depends_on:
      - identityservice
      - profileservice
    networks:
      - psyconnect-network
    env_file:
      - .env
    restart: unless-stopped

  identityservice:
    build:
      context: ./
      dockerfile: ./identityservice/Dockerfile.debug
    container_name: identityservice
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/identityservice
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD_IDENTITY_SERVICE}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      BOOTSTRAP_ADDRESS: kafka:9092
      GRPC_PORT: ${GRPC_PORT}
      REDIS_PORT: ${REDIS_PORT}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started
      profileservice:
        condition: service_started
      notificationservice:
        condition: service_started
    networks:
      - psyconnect-network
    env_file:
      - .env
    restart: unless-stopped

  profileservice:
    build:
      context: .
      dockerfile: ./profileservice/Dockerfile.debug
    container_name: profileservice
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD_PROFILE_SERVICE}
      BOOTSTRAP_ADDRESS: kafka:9092
    ports:
      - "8081:8081"
    depends_on:
      neo4j:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - psyconnect-network
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  notificationservice:
    build:
      context: .
      dockerfile: ./notificationservice/Dockerfile
    container_name: notificationservice
    ports:
      - "8082:8082"
    networks:
      - psyconnect-network
    env_file:
      - .env
    restart: unless-stopped

  consultationservice:
    build:
      context: ./consultationservice
      dockerfile: ./Dockerfile
    container_name: consultation_service
    ports:
      - "${SERVICE_PORT:-8083}:${SERVICE_PORT:-8083}"
    environment:
      SERVICE_ENV: ${SERVICE_ENV:-development}
      SERVICE_PORT: ${SERVICE_PORT:-8083}
      DB_HOST: ${DB_HOST:-mongodb}
      DB_PORT: ${DB_PORT:-27017}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME:-consultation}
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - psyconnect-network
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASS}
    volumes:
      - mongo_data:/data/db
    networks:
      - psyconnect-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  db:
    image: mysql:8
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD_IDENTITY_SERVICE}
      MYSQL_DATABASE: identityservice
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
      - db-data:/var/lib/mysql
    networks:
      - psyconnect-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD_IDENTITY_SERVICE}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  neo4j:
    image: neo4j:5
    container_name: neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD_PROFILE_SERVICE}
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    networks:
      - psyconnect-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - psyconnect-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  zookeeper:
    image: zookeeper
    container_name: zookeeper
    restart: always
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"
    networks:
      - psyconnect-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - psyconnect-network

volumes:
  db-data:
    driver: local
  neo4j-data:
    driver: local
  mongo_data:
    driver: local
  redis-data:
    driver: local

networks:
  psyconnect-network:
    driver: bridge
