version: "3.8"

services:
  # Redis for caching (Local-only utility)
  redis:
    image: redis:7-alpine
    container_name: psyconnect-redis-dev
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Zookeeper for Kafka
  zookeeper:
    image: zookeeper:latest
    container_name: psyconnect-zookeeper-dev
    ports:
      - "2181:2181"
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    restart: unless-stopped

  # Kafka for messaging
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: psyconnect-kafka-dev
    ports:
      - "19092:29094" # Host:Container - avoid Colima SSH conflict
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9094,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094,PLAINTEXT_HOST://0.0.0.0:29094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_MESSAGE_MAX_BYTES: 1000000000
      KAFKA_REPLICA_FETCH_MAX_BYTES: 1000000000
      KAFKA_MAX_REQUEST_SIZE: 1000000000
    depends_on:
      - zookeeper
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:9094",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Notification Service (Go)
  notification-service:
    build:
      context: ../services/notificationservice
      dockerfile: Dockerfile
    container_name: psyconnect-notification-go-dev
    ports:
      - "8082:8082"
    environment:
      # SMTP Configuration
      - SMPT_HOST=smtp.gmail.com
      - SMPT_PORT=587
      - SMPT_MAIL=codemail.noreply@gmail.com
      - SMPT_APP_PASS=pxvd mmkx gzvu nshn

      # Kafka Configuration
      - KAFKA_BROKERS=kafka:9094
      - KAFKA_GROUP_ID=notification-group

      # Database Configuration (optional - for notification history)
      # Uncomment if you want to use MySQL for notification persistence
      # - DB_USER=root
      # - DB_PASSWORD=your-password
      # - DB_HOST=mysql
      # - DB_PORT=3306
      # - DB_NAME=notification_db

      # Firebase Configuration (optional - for push notifications)
      # Uncomment and provide path to firebase credentials
      # - FIREBASE_CREDENTIALS=/app/firebase-credentials.json

      # Server Configuration
      - PORT=8082
      - ENVIRONMENT=development

    # Uncomment if using Firebase
    # volumes:
    #   - ./firebase-credentials.json:/app/firebase-credentials.json:ro

    depends_on:
      kafka:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8082/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

    restart: unless-stopped

  # Loki - Log aggregation
  loki:
    image: grafana/loki:2.9.3
    container_name: psyconnect-loki-dev
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:10.3.1
    container_name: psyconnect-grafana-dev
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=16032004
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ../services/loggingservice/grafana/provisioning:/etc/grafana/provisioning
      - ../services/loggingservice/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

  # Prometheus - Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: psyconnect-prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - ../services/loggingservice/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped

  # Tempo - Distributed tracing
  tempo:
    image: grafana/tempo:latest
    container_name: psyconnect-tempo-dev
    user: "0" # Fix permission denied for /tmp/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../services/loggingservice/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/tmp/tempo
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    container_name: psyconnect-dozzle-dev
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  loki-data:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local
  tempo-data:
    driver: local
