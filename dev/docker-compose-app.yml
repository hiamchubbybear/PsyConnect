version: "3.8"

services:
  apigateway:
    build:
      context: ../services/apigateway
      dockerfile: Dockerfile
    container_name: psyconnect-apigateway-dev
    ports:
      - "8888:8888"
    environment:
      - BOOTSTRAP_ADDRESS=kafka:9094
      - SPRING_PROFILES_ACTIVE=cicd
    depends_on:
      - kafka
      - identityservice
    networks:
      - default
    restart: unless-stopped

  identityservice:
    build:
      context: ../services/identityservice
      dockerfile: Dockerfile
    container_name: psyconnect-identityservice-dev
    ports:
      - "8080:8080"
    environment:
      - BOOTSTRAP_ADDRESS=kafka:9094
      - SPRING_PROFILES_ACTIVE=cicd
      # Override localhost with service names or internal networking
      - baseUriNotificationService=notificationservice
      - baseUriProfileService=profileservice
    env_file:
      - .env # Load remote DB credentials
    depends_on:
      - kafka
    networks:
      - default
    restart: unless-stopped

  profileservice:
    build:
      context: ../services/profileservice
      dockerfile: Dockerfile
    container_name: psyconnect-profileservice-dev
    ports:
      - "8081:8081"
      - "50051:50051" # gRPC port
    environment:
      - BOOTSTRAP_ADDRESS=kafka:9094
      - SPRING_PROFILES_ACTIVE=cicd
      - spring.kafka.bootstrap-servers=kafka:9094
      - GRPC_SERVER_PORT=50051
    env_file:
      - .env
    depends_on:
      - kafka
    networks:
      - default
    restart: unless-stopped

  notificationservice:
    build:
      context: ../services/notificationservice
      dockerfile: Dockerfile
    container_name: psyconnect-notificationservice-dev
    ports:
      - "8082:8082"
    environment:
      - KAFKA_BROKER=kafka:9094
      - PORT=8082
    env_file:
      - .env
    depends_on:
      - kafka
    networks:
      - default
    restart: unless-stopped

  chatservice:
    build:
      context: ../services/chatservice
      dockerfile: Dockerfile
    container_name: psyconnect-chatservice-dev
    ports:
      - "8083:8083"
    environment:
      - SERVICE_PORT=8083
      - SERVICE_HOST=0.0.0.0
      - DB_NAME=chatservice
      - MONGO_URI=mongodb+srv://tranvanhuy12_db_user:nu3xNZ9crMC4xrjv@cluster0.bbfwgos.mongodb.net/chatservice
      - KAFKA_ADDRESS=kafka:9094
      - KAFKA_TOPIC=chat_topic
      - KAFKA_NOTIFICATION_TOPIC=notification_topic
      - GRPC_ADDRESS=profileservice:9091
      - JWT_SIGNER_
      - ENVIRONMENT=dev
    depends_on:
      - kafka
    networks:
      - default
    restart: unless-stopped

  consultationservice:
    build:
      context: ../services/consultationservice
      dockerfile: Dockerfile
    container_name: psyconnect-consultationservice-dev
    ports:
      - "8084:8084"
    environment:
      - KAFKA_BROKERS=kafka:9094
      - ENVIRONMENT=dev
      - DB_NAME=consultationservice
      - MONGO_URI=mongodb+srv://tranvanhuy12_db_user:nu3xNZ9crMC4xrjv@cluster0.bbfwgos.mongodb.net/consultationservice
      - JWT_SIGNER_
      - CONSULTATION_REDIS_ADDRESS=redis:6379
      - SERVICE_PORT=8084
      - SERVICE_HOST=0.0.0.0
      - KAFKA_ADDRESS=kafka:9094
      - KAFKA_TOPIC=consultation.test
      - KAFKA_PARTITION=0
      - KAFKA_NOTIFICATION_TOPIC=notification.test
      - GRPC_ADDRESS=profileservice:9091
    depends_on:
      - kafka
      - redis
    networks:
      - default
    restart: unless-stopped

  logging-service-app:
    build:
      context: ../services/loggingservice
      dockerfile: Dockerfile
    container_name: psyconnect-loggingservice-app-dev
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - KAFKA_GROUP_ID=logging-service
      - KAFKA_TOPIC=logging-service
      - LOKI_ENABLED=true
      - LOKI_URL=http://loki:3100
      - FILE_LOGGER_ENABLED=false # Use stdout for Dozzle
      - SERVER_PORT=8889
      - ENVIRONMENT=development
    ports:
      - "8889:8889"
    depends_on:
      - kafka
      - loki
    networks:
      - default
    restart: unless-stopped
