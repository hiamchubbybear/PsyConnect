spring.application.name=profileservice
spring.data.neo4j.database=neo4j
spring.neo4j.authentication.password=12345678
spring.neo4j.authentication.username=neo4j
spring.neo4j.uri=bolt://neo4j:7687
server.port=8081
debug=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
#Logging and Audit
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.web.servlet=DEBUG
logging.level.feign=DEBUG
# Redis configuration
spring.data.redis.database=0
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=12345678
spring.data.redis.timeout=60000
# gRPC
grpc.server.port=9091
# Kafka
BOOTSTRAP_ADDRESS=kafka:9092

spring.kafka.consumer.group-id=profile-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.profiles.active=cicd
