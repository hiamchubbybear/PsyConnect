

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


spring.security.oauth2.client.registration.facebook.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.redirect-uri=${API_OAUTH2_REDIRECT_BASE:https://api.chessy.dev}/oauth2/callback/{registrationId}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile

spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v12.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v12.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,picture
spring.security.oauth2.client.provider.facebook.user-name-attribute=id

spring.security.oauth2.client.registration.google.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=${API_OAUTH2_REDIRECT_BASE:https://api.chessy.dev}/oauth2/callback/{registrationId}
spring.security.oauth2.client.registration.google.scope=openid,email,profile,https://www.googleapis.com/auth/userinfo.profile,https://www.googleapis.com/auth/userinfo.email,https://www.googleapis.com/auth/user.addresses.read,https://www.googleapis.com/auth/user.birthday.read,https://www.googleapis.com/auth/user.gender.read

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

app.oauth2.redirect-base=${FRONTEND_OAUTH2_REDIRECT_BASE:https://psyconnect.dev}

baseUriNotificationService=${NOTIFICATION_SERVICE_URL:http://notificationservice}
baseUriProfileService=${PROFILE_SERVICE_URL:http://profileservice}

SIGNER_KEY=${SIGNER_KEY}

logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.servlet.DispatcherServlet=INFO
logging.level.org.springframework.web.servlet=INFO
logging.level.feign=DEBUG
logging.level.org.apache.kafka.clients.NetworkClient=OFF

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true

grpc.security.auth-enabled=false
grpc.server.port=50051

BOOTSTRAP_ADDRESS=${KAFKA_BROKERS:localhost:19092}
spring.kafka.bootstrap-servers=${BOOTSTRAP_ADDRESS}

spring.kafka.consumer.group-id=identity-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.retries=0
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=3000
spring.kafka.producer.properties.linger.ms=0
spring.kafka.producer.properties.max.in.flight.requests.per.connection=1
spring.kafka.producer.properties.max.block.ms=5000

identity.kafka.topic.user-created=identity.user-created
identity.kafka.topic.user-updated=identity.user-updated
identity.kafka.topic.user-deleted=identity.user-deleted
NOTIFICATION_CREATE_TOPIC=notification.user-create

server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.path=/
server.servlet.session.cookie.domain=${COOKIE_DOMAIN:chessy.dev}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dohfd2ns8}
cloudinary.api-key=${CLOUDINARY_API_KEY:PLACEHOLDER_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:PLACEHOLDER_API_SECRET}
