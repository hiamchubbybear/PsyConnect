<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Your Password</title>
    <style>
      body {
        font-family: "Quicksand", sans-serif;
        background-color: #f4f4f5;
        margin: 0;
        padding: 0;
        color: #171717;
      }
      .email__container {
        max-width: 520px;
        margin: 40px auto;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 24px 32px;
        text-align: center;
        transition: all 0.2s ease;
      }
      .email__header {
        font-size: 1.25rem;
        font-weight: 600;
        color: #18181b;
        margin-bottom: 12px;
      }
      .email__text {
        font-size: 0.95rem;
        color: #52525b;
        line-height: 1.6;
        margin: 8px 0;
      }
      .email__btn {
        display: inline-block;
        background: #18181b;
        color: #fff !important;
        font-weight: 500;
        font-size: 0.95rem;
        padding: 12px 24px;
        margin-top: 20px;
        border-radius: 6px;
        text-decoration: none;
        transition: background 0.2s ease;
      }
      .email__btn:hover {
        background: #27272a;
      }
      .email__expiry {
        margin-top: 16px;
        font-size: 0.85rem;
        color: #dc2626;
        font-weight: 500;
      }
      .email__footer {
        border-top: 1px solid #e4e4e7;
        padding-top: 12px;
        font-size: 0.8rem;
        color: #71717a;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">Reset Your Password</div>
      <p class="message">
        We received a request to reset your password. Click the button below to
        set up a new one:
      </p>
      <a class="btn" href="http://psyconnect.chessy.dev/auth/password-reset?email={EMAIL}&token={TOKEN}&provider=web"
        >Reset Password</a
      >
      <p class="expiry">This link will expire in 15 minutes.</p>
      <p class="message">
        If you did not request a password reset, you can safely ignore this
        email.
      </p>
      <div class="email__footer">
        &copy; 2025 PsyConnect. All rights reserved.
      </div>
    </div>
  </body>
</html>
