<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Psyconnect</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Inter variable font — all weights 100-900 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Material Icons (needed for component icons) -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <link
      id="favicon"
      rel="icon"
      type="image/svg+xml"
      href="./assets/sig-logo/iconic-logo-light.svg"
    />
  </head>

  <body>
    <app-root></app-root>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const favicon = document.getElementById("favicon");

        function updateFavicon() {
          const isDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          favicon.href = isDark
            ? "./assets/sig-logo/iconic-logo-dark.svg"
            : "./assets/sig-logo/iconic-logo-light.svg";
          const newFavicon = favicon.cloneNode();
          favicon.parentNode.replaceChild(newFavicon, favicon);
        }

        updateFavicon();
        window
          .matchMedia("(prefers-color-scheme: dark)")
          .addEventListener("change", updateFavicon);
      });
    </script>
  </body>
</html>
