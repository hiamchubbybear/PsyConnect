<div class="scheduler-container fade-in">
  <div class="calendar-header">
    <div class="nav-controls">
      <button
        class="btn btn-outline btn-sm"
        mwlCalendarPreviousView
        [view]="view"
        [(viewDate)]="viewDate"
      >
        <svg
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <h3>{{ viewDate | date: "MMMM yyyy" }}</h3>

      <button
        class="btn btn-outline btn-sm"
        mwlCalendarNextView
        [view]="view"
        [(viewDate)]="viewDate"
      >
        <svg
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>

      <button
        class="btn btn-outline btn-sm"
        mwlCalendarToday
        [(viewDate)]="viewDate"
      >
        Today
      </button>
    </div>

    <div class="actions">
      <button class="btn btn-primary btn-sm">+ Create Event</button>
    </div>
  </div>

  <div class="calendar-wrapper card">
    <mwl-calendar-week-view
      [viewDate]="viewDate"
      [events]="events"
      [dayStartHour]="8"
      [dayEndHour]="17"
      [precision]="'minutes'"
      [hourSegments]="2"
      [hourSegmentHeight]="30"
    >
    </mwl-calendar-week-view>
  </div>
</div>
