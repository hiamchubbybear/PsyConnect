<div class="bookings-container">
  <div class="page-header">
    <h1>Bookings</h1>
    <p>See your scheduled events from your calendar events links.</p>
  </div>

  <div class="filter-tabs">
    <button class="filter-tab active">Upcoming</button>
    <button class="filter-tab">Pending</button>
    <button class="filter-tab">Recurring</button>
    <button class="filter-tab">Past</button>
    <button class="filter-tab">Cancelled</button>
  </div>

  <div class="bookings-list">
    <!-- Month Header -->
    <h3 class="month-divider">July</h3>

    <!-- Booking Item -->
    <div class="booking-row">
      <div class="booking-date">
        <span class="day-name">Wed</span>
        <span class="day-number">28</span>
      </div>

      <div class="booking-divider"></div>

      <div class="booking-time-location">
        <div class="info-line">
          <svg
            viewBox="0 0 24 24"
            width="14"
            height="14"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span class="time">09:00 - 09:30</span>
        </div>
        <div class="info-line">
          <svg
            viewBox="0 0 24 24"
            width="14"
            height="14"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <span class="location">Online</span>
        </div>
      </div>

      <div class="booking-details">
        <h4 class="booking-title">30min call meeting Peer &lt;&gt; Leslie</h4>
        <div class="attendees">
          <div class="avatar">
            <img [src]="null | avatarFallback:'user_1'" alt="Peer" />
          </div>
          <div class="avatar">
            <img [src]="null | avatarFallback:'user_2'" alt="Leslie" />
          </div>
        </div>
      </div>
    </div>

    <!-- Booking Item 2 -->
    <div class="booking-row striped">
      <div class="booking-date">
        <span class="day-name">Thu</span>
        <span class="day-number">29</span>
      </div>

      <div class="booking-divider"></div>

      <div class="booking-time-location">
        <div class="info-line">
          <svg
            viewBox="0 0 24 24"
            width="14"
            height="14"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span class="time">11:15 - 11:45</span>
          <span class="status-indicator warning"></span>
        </div>
        <div class="info-line">
          <svg
            viewBox="0 0 24 24"
            width="14"
            height="14"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <span class="location">Online</span>
        </div>
      </div>

      <div class="booking-details">
        <h4 class="booking-title">
          30min call meeting Olivia, Liam &lt;&gt; Alban
        </h4>
        <div class="attendees">
          <div class="avatar">
            <img [src]="null | avatarFallback:'user_3'" alt="Olivia" />
          </div>
          <div class="avatar">
            <img [src]="null | avatarFallback:'user_4'" alt="Liam" />
          </div>
          <div class="avatar">
            <img [src]="null | avatarFallback:'user_5'" alt="Alban" />
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
