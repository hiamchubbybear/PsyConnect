<div class="methods-container">
  <header class="page-header">
    <div>
      <h1>{{ 'PAYMENT.Methods.Title' | translate }}</h1>
      <p class="subtitle">{{ 'PAYMENT.Methods.Subtitle' | translate }}</p>
    </div>
    <button class="btn-primary">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      {{ 'PAYMENT.Methods.AddNew' | translate }}
    </button>
  </header>

  <div class="methods-grid">
    <div *ngFor="let method of methods" class="method-card">
      <div class="method-icon">
        <app-icon [name]="getMethodIcon(method.type)" [size]="24"></app-icon>
      </div>
      <div class="method-details">
        <h3>{{ method.name }}</h3>
        <p *ngIf="method.expiryDate">{{ 'PAYMENT.Methods.Expires' | translate }}: {{ method.expiryDate }}</p>
        <span *ngIf="method.isDefault" class="default-badge">{{ 'PAYMENT.Methods.Default' | translate }}</span>
      </div>
      <div class="method-actions">
        <button *ngIf="!method.isDefault" class="btn-secondary" (click)="setDefault(method)">
          {{ 'PAYMENT.Methods.SetDefault' | translate }}
        </button>
        <button class="btn-icon btn-danger" (click)="deleteMethod(method.id)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
      </div>
    </div>
  </div>
</div>
