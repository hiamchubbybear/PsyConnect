<div class="chat-input-container">
  <input
    type="text"
    [placeholder]="placeholder | translate"
    [(ngModel)]="messageText"
    (keyup.enter)="onKeyUpEnter($event)"
    [disabled]="disabled"
  />

  <button
    class="attach-btn"
    (click)="attachFile.emit()"
    title="Attach file"
    [disabled]="disabled"
  >
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
    >
      <path
        d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"
      />
    </svg>
  </button>

  <button
    class="emoji-btn"
    (click)="addEmoji.emit()"
    title="Add emoji"
    [disabled]="disabled"
  >
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
    >
      <circle cx="12" cy="12" r="10" />
      <path d="M8 14s1.5 2 4 2 4-2 4-2" />
      <line x1="9" y1="9" x2="9.01" y2="9" />
      <line x1="15" y1="9" x2="15.01" y2="9" />
    </svg>
  </button>

  <button
    class="send-btn"
    (click)="onSend()"
    [disabled]="!messageText.trim() || disabled"
    type="button"
  >
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
    >
      <line x1="22" y1="2" x2="11" y2="13" />
      <polygon points="22 2 15 22 11 13 2 9 22 2" />
    </svg>
  </button>
</div>
