<div
  class="message-wrapper"
  [class.mine]="message.isMine"
  [class.failed]="message.status === 'failed'"
  [class.sending]="message.status === 'sending'"
>
  <!-- Avatar: only for first message in group -->
  <div class="message-avatar" *ngIf="!message.isMine && message.isFirstInGroup">
    <img [src]="message.userAvatar" [alt]="message.userName" appImgFallback />
  </div>

  <!-- Spacer for grouped messages (maintains alignment) -->
  <div
    class="avatar-spacer"
    *ngIf="!message.isMine && !message.isFirstInGroup"
  ></div>

  <div class="message-content">
    <!-- Name and Timestamp: only for first message in group -->
    <div
      class="message-header"
      *ngIf="!message.isMine && message.isFirstInGroup"
    >
      <span class="message-author">{{ message.userName }}</span>
      <span class="message-time" *ngIf="message.showTimestamp">
        {{ formatTime(message.timestamp) }}
      </span>
    </div>

    <div class="message-bubble" [class.mine]="message.isMine">
      <p>{{ message.content }}</p>
      <!-- Session Card: shown when a booking is embedded in the message -->
      <app-session-card
        *ngIf="message.sessionData"
        [session]="message.sessionData"
      ></app-session-card>
    </div>

    <!-- Status indicators for my messages -->
    <div class="message-status" *ngIf="message.isMine">
      <!-- Sending indicator -->
      <span class="status-sending" *ngIf="message.status === 'sending'">
        <svg
          viewBox="0 0 24 24"
          width="12"
          height="12"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="10" stroke-opacity="0.2" />
          <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round">
            <animateTransform
              attributeName="transform"
              type="rotate"
              from="0 12 12"
              to="360 12 12"
              dur="1s"
              repeatCount="indefinite"
            />
          </path>
        </svg>
      </span>

      <!-- Sent indicator (Single Tick) -->
      <span class="status-icon" *ngIf="message.status === 'sent'">
        <svg
          viewBox="0 0 24 24"
          width="14"
          height="14"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </span>

      <!-- Delivered indicator (Double Tick) -->
      <span
        class="status-icon delivered"
        *ngIf="message.status === 'delivered'"
      >
        <svg
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="18 6 11 17 6 12"></polyline>
          <polyline points="22 6 15 17 13 15"></polyline>
        </svg>
      </span>

      <!-- Failed indicator -->
      <span
        class="status-failed"
        *ngIf="message.status === 'failed'"
        (click)="onRetry()"
      >
        <svg
          viewBox="0 0 24 24"
          width="14"
          height="14"
          fill="#ef4444"
          stroke="none"
        >
          <circle cx="12" cy="12" r="11" />
          <path
            d="M12 7v6M12 16v1"
            stroke="white"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <!-- Timestamp for my messages -->
      <span
        class="message-time-mine"
        *ngIf="message.showTimestamp && message.status !== 'failed'"
      >
        {{ formatTime(message.timestamp) }}
      </span>
    </div>

    <!-- Failed message action text -->
    <div
      class="failed-hint"
      *ngIf="message.isMine && message.status === 'failed'"
      (click)="onRetry()"
    >
      <svg
        viewBox="0 0 24 24"
        width="11"
        height="11"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      Retry
    </div>
  </div>
</div>
