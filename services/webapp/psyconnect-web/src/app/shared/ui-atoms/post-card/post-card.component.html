<article class="post-card card" (click)="openPost.emit($event)">
  <header class="post-header">
    <div
      class="author-info"
      (click)="$event.stopPropagation(); openProfile.emit(post.author_id)"
    >
      <div class="avatar">
        <!-- Placeholder or actual avatar -->
        <img
          [src]="post.author_avatar | avatarFallback:post.author_id"
          [alt]="post.author_name"
        />
      </div>
      <div class="meta">
        <span class="author-name">{{ post.author_name || "Anonymous" }}</span>
        <span class="post-time">{{ formatTime(post.created_at) }}</span>
      </div>
    </div>

    <div class="post-actions-menu">
      <!-- Context menu trigger could go here -->
    </div>
  </header>

  <div class="post-content">
    <h3 class="post-title">{{ post.title }}</h3>
    <p class="post-excerpt">
      {{ post.content | slice: 0 : 150
      }}{{ post.content.length > 150 ? "..." : "" }}
    </p>

    <div class="post-media" *ngIf="post.image_url">
      <img
        [src]="post.image_url"
        alt="Post image"
        (click)="$event.stopPropagation()"
      />
    </div>
  </div>

  <footer class="post-footer">
    <div class="reactions">
      <app-button
        variant="ghost"
        size="sm"
        [class.active]="post.user_vote === 'up'"
        (onClick)="onUpvote($event)"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M12 19V5M5 12l7-7 7 7" />
        </svg>
        <span>{{ post.upvote_count }}</span>
      </app-button>

      <app-button
        variant="ghost"
        size="sm"
        [class.active]="post.user_vote === 'down'"
        (onClick)="onDownvote($event)"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M12 5v14M19 12l-7 7-7-7" />
        </svg>
        <span>{{ post.downvote_count }}</span>
      </app-button>
    </div>

    <div class="actions">
      <app-button variant="ghost" size="sm" (onClick)="onBookmark($event)">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          class="icon"
        >
          <path
            d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"
            [attr.fill]="post.user_bookmark ? 'currentColor' : 'none'"
            stroke="currentColor"
            stroke-width="2"
          />
        </svg>
      </app-button>

      <app-button variant="ghost" size="sm" (onClick)="onShare($event)">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
      </app-button>
    </div>
  </footer>
</article>
