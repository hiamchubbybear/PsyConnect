<div class="form-group">
  <label *ngIf="label" class="form-label">{{ label }}</label>

  <div
    class="input-wrapper"
    [class.has-error]="isInvalid"
    [class.disabled]="isDisabled"
  >
    <!-- Icon (Optional) -->
    <div *ngIf="icon" class="input-icon">
      <!-- If it's a simple string, render as text/emoji, otherwise need svg logic.
            For now assuming it's an SVG content passed as string is tricky safely.
            Let's assume it's just a slot or we assume specific icons.
            Better: Use ng-content for icon or simple placeholder -->
      <ng-content select="[icon]"></ng-content>
    </div>

    <input
      [type]="inputType"
      [placeholder]="placeholder"
      [value]="value"
      [disabled]="isDisabled"
      (input)="onInput($event)"
      (blur)="onTouched()"
      class="form-control"
      [class.with-icon]="icon"
    />

    <!-- Password Toggle -->
    <button
      *ngIf="type === 'password'"
      type="button"
      class="password-toggle"
      (click)="togglePasswordVisibility()"
      tabindex="-1"
    >
      <svg
        *ngIf="!showPassword"
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
        ></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      </svg>
      <svg
        *ngIf="showPassword"
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    </button>
  </div>

  <!-- Error Messages -->
  <div *ngIf="isInvalid && control?.errors" class="error-feedback">
    <ng-container *ngFor="let error of objectKeys(control!.errors!)">
      <span *ngIf="errorMessages[error]">{{
        errorMessages[error] | translate
      }}</span>
      <!-- Fallback for unmapped errors -->
      <span *ngIf="!errorMessages[error] && error === 'required'">{{
        "COMMON.Required" | translate
      }}</span>
    </ng-container>
  </div>
</div>
