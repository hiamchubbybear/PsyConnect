<div class="toast-wrapper" [@toastAnimation] [ngStyle]="stackingStyle">
  <div class="toast-card" [class]="'toast-card--' + data.type">
    <div class="toast-main">
      <!-- Semantic Icon -->
      <div class="toast-icon">
        <ng-container [ngSwitch]="data.type">
          <!-- Session Icon (Video/Camera) -->
          <svg
            *ngSwitchCase="'session'"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M23 7l-7 5 7 5V7z" />
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
          </svg>

          <!-- Success -->
          <svg
            *ngSwitchCase="'success'"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>

          <!-- Error -->
          <svg
            *ngSwitchCase="'error'"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="15" y1="9" x2="9" y2="15"></line>
            <line x1="9" y1="9" x2="15" y2="15"></line>
          </svg>

          <!-- Warning -->
          <svg
            *ngSwitchCase="'warning'"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01"
            />
          </svg>

          <!-- Default/Info -->
          <svg
            *ngSwitchDefault
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
        </ng-container>
      </div>

      <div class="toast-content">
        <span class="toast-title" *ngIf="data.title">{{
          data.title | translate
        }}</span>
        <span class="toast-message">{{ data.message | translate }}</span>
      </div>

      <div
        class="toast-actions"
        *ngIf="data.actions && data.actions.length > 0"
      >
        <button
          *ngFor="let action of data.actions"
          class="toast-action-btn"
          [class.toast-action-btn--primary]="action.primary"
          (click)="handleAction(action)"
        >
          {{ action.label | translate }}
        </button>
      </div>

      <button class="toast-close" (click)="handleClose()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div
      class="toast-footer"
      *ngIf="remainingSeconds > 0 && data.showCountdown"
    >
      <div
        class="toast-progress"
        [style.width.%]="(remainingSeconds / (data.duration! / 1000)) * 100"
      ></div>
    </div>
  </div>
</div>
