<div class="notification-container">
  <button
    class="notification-bell"
    (click)="toggleDropdown($event)"
    [attr.aria-label]="'NOTIFICATIONS.TITLE' | translate"
  >
    <span class="bell-icon">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-bell"
      >
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
      </svg>
    </span>
    <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
  </button>

  <div class="dropdown-menu" *ngIf="isOpen" (click)="$event.stopPropagation()">
    <header class="dropdown-header">
      <h3>{{ "NOTIFICATIONS.TITLE" | translate }}</h3>
    </header>

    <div
      class="notifications-list"
      *ngIf="notifications.length > 0; else empty"
    >
      <div
        *ngFor="let n of notifications"
        class="notification-item"
        [class.unread]="!n.isRead"
        (click)="onNotificationClick(n)"
      >
        <div class="notification-icon" [ngSwitch]="n.type">
          <span *ngSwitchCase="'like'" class="icon-like">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"
              />
            </svg>
          </span>
          <span *ngSwitchCase="'comment'" class="icon-comment">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z" />
            </svg>
          </span>
          <span *ngSwitchCase="'follow'" class="icon-follow">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </span>
          <span *ngSwitchDefault class="icon-system">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
              <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
            </svg>
          </span>
        </div>
        <div class="notification-content">
          <p class="notification-text">
            <strong>{{ n.title }}</strong
            ><br />
            {{ n.body }}
          </p>
          <span class="notification-time">{{
            n.createdAt | date: "short"
          }}</span>
        </div>
        <button
          *ngIf="!n.isRead"
          class="mark-read-btn"
          (click)="markAsRead($event, n)"
          [title]="'NOTIFICATIONS.MARK_READ' | translate"
        >
          <div class="dot"></div>
        </button>
      </div>
    </div>

    <ng-template #empty>
      <div class="empty-state">
        <p>{{ "NOTIFICATIONS.EMPTY" | translate }}</p>
      </div>
    </ng-template>
  </div>
</div>
