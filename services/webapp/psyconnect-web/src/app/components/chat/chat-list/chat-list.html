<div class="chat-list">
  <div class="chat-list-header">
    <button class="back-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor">
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>
    <h2>{{ "CHAT.EXAMPLE.title" | translate }}</h2>
  </div>

  <div class="profile-card">
    <div class="profile-avatar">
      <img [src]="currentUser.avatar" [alt]="currentUser.name" />
      <span
        class="status-indicator"
        [class.online]="currentUser.isOnline"
      ></span>
    </div>
    <h3>{{ currentUser.name }}</h3>
    <div class="status-badge">
      <span>{{ currentUser.status | translate }}</span>
    </div>
  </div>

  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor">
      <circle cx="11" cy="11" r="8" />
      <path d="m21 21-4.35-4.35" />
    </svg>
    <input
      type="text"
      [placeholder]="'CHAT.EXAMPLE.search' | translate"
      [(ngModel)]="searchQuery"
    />
  </div>

  <div class="chats-header">
    <span>{{ "CHAT.EXAMPLE.friends" | translate }}</span>
  </div>

  <div class="chats-list">
    <ng-container *ngFor="let friend of filteredFriends; trackBy: trackByFn">
      <div
        class="chat-item"
        (click)="onSelect(friend)"
        [ngClass]="{ selected: friend.profileId === selectedFriendId }"
      >
        <div class="chat-avatar">
          <img
            [src]="friend.avatarUri"
            [alt]="friend.firstName + ' ' + friend.lastName"
          />
        </div>
        <div class="chat-info">
          <div class="chat-title">
            {{ friend.firstName }} {{ friend.lastName }}
          </div>
          <div class="chat-message" *ngIf="friend.hasNewMessage">
            <em>New message</em>
          </div>
        </div>
      </div>
    </ng-container>
  </div>

  <div class="load-more" *ngIf="visibleCount < friends.length">
    <button (click)="loadMoreFriends()">Load more</button>
  </div>
</div>
