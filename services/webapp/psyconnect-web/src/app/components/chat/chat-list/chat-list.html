<div class="chat-list">
  <div class="chat-list-header">
    <h2>{{ "CHAT.EXAMPLE.title" | translate }}</h2>
  </div>

  <div class="search-box">
    <span class="search-icon">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-search"
      >
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.3-4.3" />
      </svg>
    </span>
    <input
      type="text"
      [placeholder]="'CHAT.EXAMPLE.search' | translate"
      [(ngModel)]="searchQuery"
    />
  </div>

  <div class="chats-header">
    <span>{{ "CHAT.EXAMPLE.friends" | translate }}</span>
  </div>

  <div class="chats-list">
    <ng-container *ngFor="let friend of filteredFriends; trackBy: trackByFn">
      <div
        class="chat-item"
        (click)="onSelect(friend)"
        [ngClass]="{ selected: friend.profileId === selectedFriendId }"
      >
        <div class="chat-avatar">
          <img
            [src]="friend.avatarUri | avatarFallback: friend.profileId"
            [alt]="friend.firstName + ' ' + friend.lastName"
            appImgFallback
          />
        </div>
        <div class="chat-info">
          <div class="chat-title" [class.unread]="friend.hasNewMessage">
            <span class="name-text"
              >{{ friend.firstName }} {{ friend.lastName }}</span
            >
            <div class="unread-dot" *ngIf="friend.hasNewMessage"></div>
          </div>
          <div
            class="chat-message"
            [class.unread]="friend.hasNewMessage"
            *ngIf="friend.lastMessage"
          >
            <span class="truncate">{{ friend.lastMessage }}</span>
            <span class="chat-time" *ngIf="friend.lastMessageTime">
              · {{ friend.lastMessageTime | date: "shortTime" }}</span
            >
          </div>
          <div
            class="chat-message"
            [class.unread]="friend.hasNewMessage"
            *ngIf="!friend.lastMessage && friend.hasNewMessage"
          >
            <em>New message</em>
          </div>
        </div>
      </div>
    </ng-container>
  </div>

  <div class="load-more" *ngIf="visibleCount < friends.length">
    <button (click)="loadMoreFriends()">
      {{ "CHAT.EXAMPLE.loadMore" | translate }}
    </button>
  </div>
</div>
