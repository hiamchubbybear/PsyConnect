<app-horizontal-list
  [title]="'friends.list.title' | translate"
  [emptyText]="'friends.list.empty' | translate"
  [showNav]="friends.length > 4"
  [isEmpty]="friends.length === 0"
>
  <app-friend-card
    *ngFor="let friend of friends"
    [friend]="friend"
    [cardType]="'friend'"
    (message)="onMessage($event)"
    (unfriend)="onUnfriend($event)"
  >
  </app-friend-card>
</app-horizontal-list>
