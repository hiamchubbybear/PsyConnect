<section class="friend-suggestions">
  <div class="friend-suggestions__header">
    <h2 class="friend-suggestions__title">
      {{ "friends.suggestions.title" | translate }}
    </h2>

    <div class="friend-suggestions__nav" *ngIf="suggestions.length > 4">
      <button class="friend-suggestions__nav-btn" (click)="scrollLeft()">
        <lucide-icon name="chevron-left"></lucide-icon>
      </button>
      <button class="friend-suggestions__nav-btn" (click)="scrollRight()">
        <lucide-icon name="chevron-right"></lucide-icon>
      </button>
    </div>
  </div>

  <div #scrollContainer class="friend-suggestions__row">
    <app-friend-card
      *ngFor="let suggestion of suggestions"
      [friend]="suggestion"
      [cardType]="'suggestion'"
      [mutualCount]="suggestion.mutualCount"
      [mutualAvatars]="suggestion.mutualAvatars"
      (addFriend)="onAddFriend($event)"
    ></app-friend-card>
  </div>

  <ng-template #noSuggestions>
    <p class="friend-suggestions__empty">
      {{ "friends.suggestions.empty" | translate }}
    </p>
  </ng-template>
</section>
