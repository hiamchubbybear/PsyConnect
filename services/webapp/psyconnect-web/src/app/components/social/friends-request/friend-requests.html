<app-horizontal-list
  [title]="'friends.requests.title' | translate"
  [emptyText]="'friends.requests.empty' | translate"
  [showNav]="requests.length > 4"
  [isEmpty]="requests.length === 0"
>
  <app-friend-card
    *ngFor="let request of requests"
    [friend]="request"
    [cardType]="'request'"
    (accept)="onAccept($event)"
    (decline)="onDecline($event)"
  ></app-friend-card>
</app-horizontal-list>
