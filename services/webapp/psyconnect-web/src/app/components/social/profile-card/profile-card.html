<article class="profile-card">
  <div
    class="profile-card__cover"
    [style.background-image]="
      user.coverUrl ? 'url(' + user.coverUrl + ')' : null
    "
  >
    <div class="profile-card__overlay" *ngIf="user.coverUrl"></div>
  </div>

  <div class="profile-card__content">
    <div class="profile-card__avatar-wrapper">
      <div class="profile-card__avatar">
        <img
          [src]="user.avatarUrl | avatarFallback: user.name"
          [alt]="user.name"
          class="profile-card__avatar-img"
        />
      </div>
    </div>
    <div class="profile-card__info">
      <h2 class="profile-card__name">{{ user.name }}</h2>
      <div class="profile-card__role-wrapper" *ngIf="user.role">
        <span [class]="'role-pill role-pill--' + user.role.toLowerCase()">
          {{
            user.role.toLowerCase() === "therapist"
              ? ("ROLE.THERAPIST" | translate)
              : ("ROLE.USER" | translate)
          }}
        </span>
      </div>
    </div>

    <div class="profile-card__actions">
      <!-- Visitor Actions -->
      <ng-container *ngIf="!isOwnProfile">
        <button
          class="profile-card__action-btn profile-card__action-btn--primary"
          type="button"
          (click)="onMessage()"
          [attr.aria-label]="'profile.contact.message' | translate"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
            ></path>
          </svg>
          {{ "SOCIAL.wall.fields.message" | translate }}
        </button>

        <!-- Book Session for Therapist -->
        <button
          *ngIf="user.role?.toLowerCase() === 'therapist'"
          class="profile-card__action-btn profile-card__action-btn--booking"
          type="button"
          (click)="onBookSession()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
            <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01" />
          </svg>
          Đặt lịch khám
        </button>

        <button
          class="profile-card__action-btn profile-card__action-btn--secondary"
          type="button"
          [attr.aria-label]="'profile.contact.email' | translate"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect width="20" height="16" x="2" y="4" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
          {{ "SOCIAL.wall.fields.email" | translate }}
        </button>
      </ng-container>

      <!-- Owner Actions -->
      <ng-container *ngIf="isOwnProfile">
        <button class="profile-card__edit-btn" type="button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
          </svg>
          {{ "profile.edit.button" | translate }}
        </button>
      </ng-container>
    </div>
  </div>
</article>
