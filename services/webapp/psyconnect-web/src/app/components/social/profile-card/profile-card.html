<article class="profile-card">
  <div
    class="profile-card__cover"
    [style.background-image]="
      user.coverUrl ? 'url(' + user.coverUrl + ')' : null
    "
  >
    <div class="profile-card__overlay" *ngIf="user.coverUrl"></div>
  </div>

  <div class="profile-card__content">
    <div class="profile-card__avatar-wrapper">
      <div
        class="profile-card__avatar"
        *ngIf="user.avatarUrl; else avatarFallback"
      >
        <img
          [src]="user.avatarUrl"
          [alt]="user.name"
          class="profile-card__avatar-img"
        />
      </div>
      <ng-template #avatarFallback>
        <div class="profile-card__avatar profile-card__avatar--fallback">
          <span class="profile-card__avatar-initials">{{
            getInitials(user.name)
          }}</span>
        </div>
      </ng-template>
    </div>
    <div class="profile-card__info">
      <h2 class="profile-card__name">{{ user.name }}</h2>
      <p class="profile-card__role">{{ user.role }}</p>
    </div>

    <div class="profile-card__actions">
      <button
        class="profile-card__action-btn"
        type="button"
        [attr.aria-label]="'profile.contact.email' | translate"
        aria-label="Send email"
      >
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path
            d="M3.33398 5.83337L10.0007 10.8334L16.6673 5.83337M3.33398 14.1667H16.6673C17.1275 14.1667 17.5007 13.7936 17.5007 13.3334V6.66671C17.5007 6.20647 17.1275 5.83337 16.6673 5.83337H3.33398C2.87375 5.83337 2.50065 6.20647 2.50065 6.66671V13.3334C2.50065 13.7936 2.87375 14.1667 3.33398 14.1667Z"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <button
        class="profile-card__action-btn"
        type="button"
        [attr.aria-label]="'profile.contact.message' | translate"
        aria-label="Send message"
      >
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path
            d="M17.5007 9.58337C17.5048 10.6832 17.2493 11.7683 16.7549 12.75C16.1819 13.9265 15.2731 14.916 14.1402 15.6078C13.0074 16.2995 11.6988 16.6662 10.3643 16.6667C9.26448 16.6708 8.17937 16.4153 7.19732 15.9209L2.50065 17.5L4.07982 12.8034C3.58546 11.8213 3.33001 10.7362 3.33398 9.63629C3.33453 8.30179 3.70124 6.99315 4.39299 5.86032C5.08474 4.72749 6.07418 3.81866 7.25065 3.24571C8.23242 2.75129 9.3175 2.49584 10.4173 2.50004H10.834C12.5108 2.59588 14.0926 3.32169 15.2795 4.54492C16.4665 5.76815 17.1738 7.39931 17.2507 9.10421V9.58337Z"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <button
        class="profile-card__action-btn"
        type="button"
        [attr.aria-label]="'profile.contact.slack' | translate"
        aria-label="Contact on Slack"
      >

            d="M6.25 12.5C6.25 13.1904 5.69036 13.75 5 13.75C4.30964 13.75 3.75 13.1904 3.75 12.5C3.75 11.8096 4.30964 11.25 5 11.25H6.25V12.5ZM6.875 12.5C6.875 11.8096 7.43464 11.25 8.125 11.25C8.81536 11.25 9.375 11.8096 9.375 12.5V15C9.375 15.6904 8.81536 16.25 8.125 16.25C7.43464 16.25 6.875 15.6904 6.875 15V12.5Z"

          />

            d="M7.5 6.25C6.80964 6.25 6.25 5.69036 6.25 5C6.25 4.30964 6.80964 3.75 7.5 3.75C8.19036 3.75 8.75 4.30964 8.75 5V6.25H7.5ZM7.5 6.875C8.19036 6.875 8.75 7.43464 8.75 8.125C8.75 8.81536 8.19036 9.375 7.5 9.375H5C4.30964 9.375 3.75 8.81536 3.75 8.125C3.75 7.43464 4.30964 6.875 5 6.875H7.5Z"
            fill="currentColor"
          />
          <path
            d="M13.75 7.5C13.75 6.80964 14.3096 6.25 15 6.25C15.6904 6.25 16.25 6.80964 16.25 7.5C16.25 8.19036 15.6904 8.75 15 8.75H13.75V7.5ZM13.125 7.5C13.125 8.19036 12.5654 8.75 11.875 8.75C11.1846 8.75 10.625 8.19036 10.625 7.5V5C10.625 4.30964 11.1846 3.75 11.875 3.75C12.5654 3.75 13.125 4.30964 13.125 5V7.5Z"
            fill="currentColor"
          />
          <path
            d="M12.5 13.75C13.1904 13.75 13.75 14.3096 13.75 15C13.75 15.6904 13.1904 16.25 12.5 16.25C11.8096 16.25 11.25 15.6904 11.25 15V13.75H12.5ZM12.5 13.125C11.8096 13.125 11.25 12.5654 11.25 11.875C11.25 11.1846 11.8096 10.625 12.5 10.625H15C15.6904 10.625 16.25 11.1846 16.25 11.875C16.25 12.5654 15.6904 13.125 15 13.125H12.5Z"
            fill="currentColor"
          />
        </svg>
      </button>
      <button
        class="profile-card__action-btn"
        type="button"
        [attr.aria-label]="'profile.contact.phone' | translate"
        aria-label="Call phone"
      >
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path
            d="M12.5 3.33337C13.3841 3.51076 14.1971 3.9387 14.8388 4.56129C15.4805 5.18388 15.9244 5.97343 16.1167 6.83337M12.5 0.833374C14.3565 1.03652 16.0882 1.88602 17.4016 3.24427C18.7149 4.60252 19.5314 6.37355 19.7 8.25004M18.3333 13.9667V16.4667C18.3343 16.6918 18.2867 16.9146 18.1937 17.1195C18.1008 17.3244 17.9648 17.5069 17.7945 17.6549C17.6242 17.803 17.4236 17.9133 17.2062 17.9784C16.9887 18.0435 16.7597 18.0619 16.5333 18.0325C14.0136 17.7388 11.5931 16.8677 9.46667 15.4834C7.49125 14.2234 5.81144 12.5436 4.55 10.5684C3.16107 8.42917 2.28835 5.99518 2 3.46671C1.97069 3.2413 1.98893 3.01338 2.05343 2.79683C2.11794 2.58028 2.22736 2.38038 2.3743 2.21012C2.52124 2.03986 2.70233 1.90341 2.90597 1.80928C3.1096 1.71515 3.33103 1.66566 3.55501 1.66504H6.05501C6.43991 1.66117 6.81348 1.79184 7.10783 2.03359C7.40218 2.27534 7.60026 2.61334 7.66667 2.98671C7.79071 3.73205 8.00369 4.46089 8.30167 5.16004C8.40635 5.42064 8.43165 5.70604 8.37467 5.98003C8.31768 6.25402 8.18096 6.50526 7.98167 6.70504L6.93334 7.75337C8.08668 9.80691 9.76014 11.4804 11.8133 12.6334L12.8617 11.585C13.0615 11.3857 13.3127 11.249 13.5867 11.192C13.8607 11.135 14.1461 11.1603 14.4067 11.265C15.1058 11.563 15.8347 11.776 16.58 11.9C16.9577 11.9668 17.2993 12.1688 17.541 12.4684C17.7827 12.7681 17.9102 13.1478 17.9 13.5367"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>
  </div>
</article>
