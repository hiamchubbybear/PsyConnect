<!-- src/app/features/profile/components/info-field/info-field.component.html -->
<div class="info-field">
  <dt class="info-field__label">{{ label | translate }}</dt>
  <dd class="info-field__value">
    <ng-container *ngIf="isTemplateRef(value); else stringValue">
      <ng-container *ngTemplateOutlet="value"></ng-container>
    </ng-container>
    <ng-template #stringValue>{{ value }}</ng-template>
  </dd>
</div>
