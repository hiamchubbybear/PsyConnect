<div class="incoming-call-toast">
  <!-- Avatar -->
  <div class="avatar-wrapper">
    <img src="assets/mascot/psy-purple.png" alt="Caller" class="avatar" />
    <span class="status-dot"></span>
  </div>

  <!-- Info -->
  <div class="info">
    <h4 class="caller-name">{{ call.callerName }}</h4>
    <p class="call-status">Incoming Call...</p>
  </div>

  <!-- Actions -->
  <div class="actions">
    <!-- Remind / Snooze -->
    <button
      class="btn-icon snooze"
      (click)="onRemind()"
      title="Remind me later"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    </button>

    <!-- Reject -->
    <button class="btn-icon reject" (click)="onReject()" title="Decline">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M10.68 13.31a16 16 0 0 0 3.01 3.01l2.17-2.17a2 2 0 0 1 2.83 0l2.6 2.6a2 2 0 0 1 0 2.83l-.5.5C19.7 20.3 7 13 4 4l.5-.5a2 2 0 0 1 2.83 0l2.6 2.6a2 2 0 0 1 0 2.83l-2.17 2.17z"
          transform="rotate(135 12 12)"
        />
      </svg>
    </button>

    <!-- Accept -->
    <button class="btn-icon accept" (click)="onAccept()" title="Accept">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
        ></path>
      </svg>
    </button>
  </div>
</div>
