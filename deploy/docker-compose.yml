services:
  apigateway:
    image: hiamchubbybear/apigateway:latest
    ports:
      - "8888:8888"
    environment:
      - BOOTSTRAP_ADDRESS=kafka:9092

  identityservice:
    image: hiamchubbybear/identityservice:latest
    ports:
      - "8080:8080"


  profileservice:
    image: hiamchubbybear/profileservice:latest
    ports:
      - "8081:8081"

  notificationservice:
    image: hiamchubbybear/notificationservice:latest
    ports:
      - "8082:8082"

  consultationservice:
    image: hiamchubbybear/consultationservice:latest
    ports:
      - "8084:8084"
    environment:
      - KAFKA_BROKERS=kafka:9092
      - ENVIRONMENT=production
    depends_on:
      kafka:
        condition: service_healthy

  chatservice:
    image: hiamchubbybear/chatservice:latest
    ports:
      - "8083:8083"
    environment:
      - KAFKA_BROKERS=kafka:9092
      - ENVIRONMENT=production
    depends_on:
      kafka:
        condition: service_healthy

  # Logging Service
  logging-service:
    image: hiamchubbybear/loggingservice:latest
    ports:
      - "8085:8080"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_GROUP_ID=logging-service
      - KAFKA_TOPIC=logging-service
      - LOKI_ENABLED=true
      - LOKI_URL=http://loki:3100
      - FILE_LOGGER_ENABLED=true
      - ENVIRONMENT=production
    depends_on:
      kafka:
        condition: service_healthy
      loki:
        condition: service_started
    restart: unless-stopped

  # Loki - Log aggregation
  loki:
    image: grafana/loki:2.9.3
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:10.3.1
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=16032004
      - GF_SERVER_ROOT_URL=${GRAFANA_URL:-http://localhost:3000}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

  # Prometheus - Metrics
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
    restart: unless-stopped

  # -------------------------
  # INFRASTRUCTURE
  # -------------------------

  zookeeper:
    image: zookeeper:latest
    restart: always
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOO_HEAP_SIZE: 1G
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 5s
      retries: 8

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    restart: always
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xms1G -Xmx2G"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:9092 1 20 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.1
    platform: linux/amd64
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
      SERVER_PORT: 9000
    command:
      - "--message.format=AVRO"


  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  loki-data:
  grafana-data:
  prometheus-data:
