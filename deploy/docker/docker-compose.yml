services:
  # API Gateway
  apigateway:

    build:
      context: .
      dockerfile: ./apigateway/Dockerfile
    container_name: apigateway
    ports:
      - "8888:8888"
    depends_on:
      - identityservice
      - profileservice
    networks:
      - psyconnect-network
    env_file:
      - .env
    restart: unless-stopped
  # Identity Service
  identityservice:
    build:
      context: ./
      dockerfile: ./identityservice/Dockerfile.debug
    container_name: identityservice
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      profileservice:
        condition: service_started
      notificationservice:
        condition: service_started
    networks:
      - psyconnect-network
    env_file:
      - .env
    restart: unless-stopped


  # Profile Service
  profileservice:
    build:
      context: .
      dockerfile: ./profileservice/Dockerfile.debug
    container_name: profileservice
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: 12345678
      BOOTSTRAP_ADDRESS: kafka:9092
    ports:
      - "8081:8081"
    depends_on:
      neo4j:
        condition: service_started
    networks:
      - psyconnect-network
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Notification Service
  notificationservice:
    build:
      context: .
      dockerfile: ./notificationservice/Dockerfile
    container_name: notificationservice
    ports:
      - "8082:8082"
    networks:
      - psyconnect-network
    env_file:
      - .env
    restart: unless-stopped

  # Consultation Service (Go)
  consultationservice:
    build:
      context: ./consultationservice
      dockerfile: ./Dockerfile
    container_name: consultation_service
    ports:
      - "8083:8083"
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - psyconnect-network
    restart: unless-stopped

  # MongoDB
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: consultationservice
      MONGO_INITDB_ROOT_PASSWORD: 123456
    volumes:
      - mongo_data:/data/db
    networks:
      - psyconnect-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # MySQL
  db:
    image: mysql:8
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: identityservice
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
      - db-data:/var/lib/mysql
    networks:
      - psyconnect-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "mysql", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Neo4j
  neo4j:
    image: neo4j:5
    container_name: neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/12345678
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    networks:
      - psyconnect-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - psyconnect-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - psyconnect-network
    restart: unless-stopped
volumes:
  db-data:
    driver: local
  neo4j-data:
    driver: local
  mongo_data:
    driver: local
  redis-data:
    driver: local

networks:
  psyconnect-network:
    driver: bridge
