<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Your Account</title>
    <style>
      body {
        font-family: "Quicksand", sans-serif;
        background-color: #f4f4f5;
        margin: 0;
        padding: 0;
        color: #171717;
      }
      .email__container {
        max-width: 520px;
        margin: 40px auto;
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 24px 32px;
        text-align: center;
        transition: all 0.2s ease;
      }
      .email__header {
        font-size: 1.25rem;
        font-weight: 600;
        color: #18181b;
        margin-bottom: 16px;
      }
      .email__text {
        font-size: 0.95rem;
        color: #52525b;
        line-height: 1.6;
        margin: 8px 0;
      }
      .email__code {
        display: inline-block;
        background: #f4f4f5;
        border-radius: 6px;
        padding: 10px 20px;
        font-size: 1.25rem;
        font-weight: 600;
        color: #4a90e2;
        margin-top: 16px;
        letter-spacing: 2px;
      }
      .email__footer {
        border-top: 1px solid #e4e4e7;
        padding-top: 12px;
        font-size: 0.8rem;
        color: #71717a;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <div class="email__container">
      <div class="email__header">Verify Your Account</div>
      <p class="email__text">Hello <strong>{USERNAME}</strong>,</p>
      <p class="email__text">
        Here is your verification code (expires in 10 minutes):
      </p>
      <div class="email__code">{CODE}</div>
      <p class="email__text">
        If you did not request this code, please ignore this email.
      </p>
      <div class="email__footer">
        &copy; 2025 PsyConnect. All rights reserved.
      </div>
    </div>
  </body>
</html>
