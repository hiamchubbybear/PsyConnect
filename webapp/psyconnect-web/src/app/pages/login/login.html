<main class="login-page">
  <div class="login-container">
    <!-- Left Side -->
    <div class="login-info">
      <div class="info-icon">
        <svg width="64" height="64" fill="#6b7280" viewBox="0 0 24 24">
          <path
            d="M12 12c2.2 0 4-1.8 4-4S14.2 4 12 4 8 5.8 8 8s1.8 4 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"
          />
        </svg>
      </div>
      <h2>Connect & Heal Together</h2>
      <p>Join a supportive community on your mental health journey</p>
    </div>
    <div class="login-form">
      <div class="form-header">
        <h2>Welcome Back</h2>
        <p>Sign in to your account</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <label for="username">Email Address</label>
        <input
          type="text"
          id="username"
          formControlName="username"
          placeholder="exampleUsername"
          required
        />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Enter your password"
          required
        />

        <div class="form-options">
          <label> <input type="checkbox" /> Remember me </label>
          <a routerLink="/forgot-password">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary">Sign In</button>

        <div class="divider">
          <span>or continue with</span>
        </div>

        <div class="social-login">
          <button
            type="button"
            class="btn btn-google"
            (click)="handleOAuth2('google')"
          >
            Google
          </button>
          <button
            type="button"
            class="btn btn-apple"
            (click)="handleOAuth2('google')"
          >
            Facebook
          </button>
        </div>

        <p class="signup-text">
          Don’t have an account?
          <a routerLink="/signup">Create one</a>
        </p>
      </form>
    </div>
  </div>
</main>
