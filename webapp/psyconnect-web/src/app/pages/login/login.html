<main class="login-page">
  <div class="login-container">
    <div class="login-form">
      <div class="form-header">
        <h2>Welcome Back</h2>
        <p>Sign in to your account</p>
      </div>

      <form
        [formGroup]="loginForm"
        (ngSubmit)="onSubmit()"
        [class.shake-errors]="shakeErrors"
      >
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-with-error" [class.shake-errors]="shakeErrors">
            <input
              type="text"
              id="username"
              formControlName="username"
              placeholder="Enter your username"
              required
              [class.error]="
                loginForm.get('username')?.touched &&
                loginForm.get('username')?.invalid
              "
            />
            <div
              class="error-text"
              *ngIf="
                loginForm.get('username')?.touched &&
                loginForm.get('username')?.invalid
              "
            >
              <span *ngIf="loginForm.get('username')?.errors?.['required']">
                Username is required
              </span>
              <span *ngIf="loginForm.get('username')?.errors?.['minlength']">
                Username must be at least 6 characters
              </span>
            </div>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-with-error" [class.shake-errors]="shakeErrors">
            <input
              type="password"
              id="password"
              formControlName="password"
              placeholder="Enter your password"
              required
              [class.error]="
                loginForm.get('password')?.touched &&
                loginForm.get('password')?.invalid
              "
            />
            <div
              class="error-text"
              *ngIf="
                loginForm.get('password')?.touched &&
                loginForm.get('password')?.invalid
              "
            >
              <span *ngIf="loginForm.get('password')?.errors?.['required']">
                Password is required
              </span>
            </div>
          </div>
        </div>

        <!-- Options -->
        <div class="form-options">
          <label> <input type="checkbox" /> Remember me </label>
          <a routerLink="/forgot-password">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary">Sign In</button>

        <div class="divider">
          <span>or continue with</span>
        </div>

        <div class="social-login">
          <button
            type="button"
            class="btn btn-google btn-primary"
            (click)="handleOAuth2('google')"
          >
            Google
          </button>
          <button
            type="button"
            class="btn btn-apple btn-primary"
            (click)="handleOAuth2('facebook')"
          >
            Facebook
          </button>
        </div>

        <p class="signup-text">
          Don’t have an account?
          <a routerLink="/auth/signup">Create one</a>
        </p>
      </form>
    </div>
  </div>
</main>
