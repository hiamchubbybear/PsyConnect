<section class="search-bar">
  <input
    id="searchInput"
    type="text"
    placeholder="Search..."
    [(ngModel)]="query"
  />
  <select [(ngModel)]="selectedCategory">
    <option>All categories</option>
    <option>1 category selected</option>
  </select>
  <!-- nút search có thể giữ lại hoặc bỏ -->
  <button>Search</button>
</section>

<div class="tags" *ngIf="query">
  <span id="activeTag" class="tag">{{ query }} ✕</span>
  <button class="clear" (click)="clearTag()">Clear</button>
</div>

<section id="results" class="results">
  <div *ngIf="filtered.length === 0" class="empty">No results found.</div>

  <div class="card" *ngFor="let post of filtered; trackBy: trackByTitle">
    <img [src]="post.image" [alt]="post.title" />
    <div class="card-body">
      <h3>{{ post.title }}</h3>
      <p>{{ post.author }}</p>
    </div>
  </div>
</section>

<div class="footer">
  <div id="count">{{ resultsCount }} results</div>
  <button (click)="loadMore()" [disabled]="filtered.length === posts.length">
    Show me more results →
  </button>
</div>
