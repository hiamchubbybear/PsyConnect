<div class="files">
  <h2>Files</h2>

  <div class="upload">
    <label for="folderSelect">Select Folder:</label>
    <select [(ngModel)]="selectedFolderId" (change)="onFolderChange()">
      <option value="">All folders</option>
      <option *ngFor="let folder of folders" [value]="folder.id">
        {{ folder.name }}
      </option>
    </select>
    <!--
    <select
      id="folderSelect"
      [(ngModel)]="selectedFolderId"
      (change)="loadFilesByFolder(selectedFolderId)"
    >
      <option *ngFor="let folder of folders" [value]="folder.id">
        {{ folder.name }}
      </option>
    </select> -->

    <input type="file" (change)="onFileSelected($event)" />
    <button (click)="upload()" [disabled]="!uploadFile || !selectedFolderId">
      Upload
    </button>
  </div>

  <div *ngIf="loading">Loading files...</div>

  <table *ngIf="!loading && files.length">
    <thead>
      <tr>
        <th>Name</th>
        <th>Size (KB)</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let file of files">
        <td>{{ file.name }}</td>
        <td>{{ file.size / 1024 | number : "1.0-2" }}</td>
        <td>
          <button (click)="downloadFile(file)">Download</button>
          <button (click)="deleteFile(file)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && files.length === 0">No files found.</div>
</div>
