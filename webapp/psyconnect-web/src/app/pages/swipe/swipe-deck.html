<div class="deck">
  <ng-container *ngIf="currentTherapist; else empty">
    <app-swipe-card
      [therapist]="currentTherapist"
      [index]="0"
      (swiped)="onCardSwiped($event)"
      [class.rotate]="isOverlayOpen"
    ></app-swipe-card>
  </ng-container>

  <ng-template #empty>
    <div class="empty">No more therapists — check back later</div>
  </ng-template>
  <app-therapist-profile-overlay
    *ngIf="isOverlayOpen && selectedTherapist"
    [therapist]="selectedTherapist"
    [isVisible]="isOverlayOpen"
    (closeOverlay)="onCloseOverlay()"
    (bookAppointment)="onBookAppointment($event)"
    (sendMessage)="onSendMessage($event)"
  ></app-therapist-profile-overlay>
</div>
