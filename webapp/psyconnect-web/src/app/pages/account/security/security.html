<section class="account-section">
  <h2>Mật khẩu và bảo mật</h2>
  <p class="account-section__description">
    Quản lý mật khẩu, đăng nhập, và phương thức bảo mật khác.
  </p>

  <div class="account-section__group">
    <div
      class="account-row"
      *ngFor="let item of securityItems"
      (click)="navigate(item)"
    >
      <span>{{ item.label }}</span>
      <span class="account-row__icon">›</span>
    </div>
  </div>

  <h3 class="account-section__subheading">Kiểm tra bảo mật</h3>
  <p class="account-section__description">
    Xem xét các vấn đề bảo mật trên thiết bị, email và ứng dụng.
  </p>

  <div class="account-section__group">
    <div
      class="account-row"
      *ngFor="let item of securityCheckItems"
      (click)="navigate(item)"
    >
      <span>{{ item.label }}</span>
      <span class="account-row__icon">›</span>
    </div>
  </div>
</section>
