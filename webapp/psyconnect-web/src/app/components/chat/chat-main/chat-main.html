<div class="chat-main">
  <div class="chat-header">
    <div class="chat-info" *ngIf="selectedFriend as friend">
      <div class="chat-avatar">
        <img
          *ngIf="friend.avatarUri && friend.avatarUri.startsWith('http')"
          [src]="friend.avatarUri"
          [alt]="friend.firstName"
        />
        <div
          *ngIf="!friend.avatarUri || !friend.avatarUri.startsWith('http')"
          class="avatar-fallback"
        >
          {{ friend.firstName.charAt(0).toUpperCase() }}
        </div>
      </div>

      <div class="chat-meta">
        <h2 class="chat-title">{{ friend.firstName }} {{ friend.lastName }}</h2>
      </div>
    </div>

    <div class="chat-info" *ngIf="!selectedFriend">
      <h2 class="chat-title text-muted">
        {{ "CHAT.EXAMPLE.selectFriend" | translate }}
      </h2>
    </div>
  </div>
  <div
    class="load-more-container"
    *ngIf="messages.length > 0"
    (scroll)="onScroll()"
  >
    <button
      class="load-more-btn"
      (click)="loadOlderMessages()"
      [disabled]="isLoadingOld"
    >
      <ng-container *ngIf="!isLoadingOld; else loadingOldTpl">
        {{ "CHAT.EXAMPLE.loadMore" | translate }}
      </ng-container>
      <ng-template #loadingOldTpl>
        <span class="loading">{{ "CHAT.EXAMPLE.loading" | translate }}</span>
      </ng-template>
    </button>
  </div>
  <div class="messages-container" #scrollContainer>
    <ng-container *ngIf="selectedFriend; else noFriend">
      <ng-container *ngFor="let message of messages; trackBy: trackByMessageId">
        <app-message-bubble [message]="message"></app-message-bubble>
      </ng-container>

      <div *ngIf="isTyping" class="typing-indicator">
        <div class="typing-avatar">
          <img
            [src]="
              selectedFriend.avatarUri || 'assets/images/default-avatar.png'
            "
            [alt]="selectedFriend.firstName || 'User'"
          />
        </div>
        <div class="typing-bubble">
          <span>
            {{ selectedFriend.firstName }} {{ "CHAT.TYPING" | translate }}
          </span>
        </div>
      </div>
    </ng-container>

    <ng-template #noFriend>
      <div class="no-friend-selected">
        {{ "CHAT.EXAMPLE.noFriendSelected" | translate }}
      </div>
    </ng-template>
  </div>

  <div class="message-input-container" *ngIf="selectedFriend">
    <input
      type="text"
      [placeholder]="'CHAT.EXAMPLE.placeholder' | translate"
      [(ngModel)]="messageText"
      (keyup.enter)="onSendMessage()"
    />

    <button class="attach-btn" title="Attach file">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
      >
        <path
          d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"
        />
      </svg>
    </button>

    <button class="emoji-btn" title="Add emoji">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
      >
        <circle cx="12" cy="12" r="10" />
        <path d="M8 14s1.5 2 4 2 4-2 4-2" />
        <line x1="9" y1="9" x2="9.01" y2="9" />
        <line x1="15" y1="9" x2="15.01" y2="9" />
      </svg>
    </button>

    <button
      class="send-btn"
      (click)="onSendMessage()"
      [disabled]="!messageText.trim()"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
      >
        <line x1="22" y1="2" x2="11" y2="13" />
        <polygon points="22 2 15 22 11 13 2 9 22 2" />
      </svg>
    </button>
  </div>

  <div class="files-sidebar">
    <button class="file-btn" title="Files">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
      >
        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" />
        <polyline points="13 2 13 9 20 9" />
      </svg>
      <span>{{ "CHAT.EXAMPLE.files" | translate }}</span>
    </button>

    <button
      class="file-btn"
      title="Documents"
      style="background: #dbeafe; color: #1e40af"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
      >
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <polyline points="14 2 14 8 20 8" />
        <line x1="16" y1="13" x2="8" y2="13" />
        <line x1="16" y1="17" x2="8" y2="17" />
        <polyline points="10 9 9 9 8 9" />
      </svg>
      <span>{{ "CHAT.EXAMPLE.documents" | translate }}</span>
    </button>

    <button
      class="file-btn"
      title="Images"
      style="background: #fef3c7; color: #92400e"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
      >
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
        <circle cx="8.5" cy="8.5" r="1.5" />
        <polyline points="21 15 16 10 5 21" />
      </svg>
      <span>{{ "CHAT.EXAMPLE.images" | translate }}</span>
    </button>

    <button
      class="file-btn"
      title="Videos"
      style="background: #cffafe; color: #155e75"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
      >
        <polygon points="23 7 16 12 23 17 23 7" />
        <rect x="2" y="5" width="14" height="14" rx="2" ry="2" />
      </svg>
      <span>{{ "CHAT.EXAMPLE.videos" | translate }}</span>
    </button>

    <button
      class="file-btn"
      title="Links"
      style="background: #fecaca; color: #991b1b"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
      >
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
        <path
          d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
        />
      </svg>
      <span>{{ "CHAT.EXAMPLE.links" | translate }}</span>
    </button>

    <button
      class="file-btn"
      title="More"
      style="background: #d4f4dd; color: #166534"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
      >
        <circle cx="12" cy="12" r="1" />
        <circle cx="19" cy="12" r="1" />
        <circle cx="5" cy="12" r="1" />
      </svg>
      <span>{{ "CHAT.EXAMPLE.more" | translate }}</span>
    </button>
  </div>
</div>
