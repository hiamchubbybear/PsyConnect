<header class="header" [class.hidden]="isHidden">
  <div class="header-left">
    <a href="/" class="logo">Calme</a>
  </div>

  <nav class="header-center">
    <a href="/feature">Feature</a>
    <a href="/therapist">Therapist</a>
    <a href="/community">Community</a>
    <a href="/about">About</a>
  </nav>

  <div class="header-right" *ngIf="auth.isLoggedIn(); else guest">
    <button mat-button [matMenuTriggerFor]="menu" class="avatar-btn">
      <img [src]="userAvatarUrl" alt="Avatar" class="avatar" />
      <span class="username">{{ userName }}</span>
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item routerLink="/profile">Profile</button>
      <button mat-menu-item (click)="logout()">Logout</button>
    </mat-menu>
  </div>

  <ng-template #guest>
    <div class="header-right">
      <a href="/auth/login" class="auth">Login</a>
      <a href="/auth/signup" class="auth signup">Sign Up</a>
    </div>
  </ng-template>

  <div class="menu-toggle" (click)="toggleMenu()">☰</div>

  <div class="mobile-menu" [class.open]="isMenuOpen">
    <a href="/feature">Feature</a>
    <a href="/therapist">Therapist</a>
    <a href="/community">Community</a>
    <a href="/about">About</a>

    <ng-container *ngIf="auth.isLoggedIn(); else guestMobile">
      <button mat-button [matMenuTriggerFor]="menuMobile" class="avatar-btn">
        <img [src]="userAvatarUrl" alt="Avatar" class="avatar" />
        <span class="username">{{ userName }}</span>
      </button>
      <mat-menu #menuMobile="matMenu">
        <button mat-menu-item routerLink="/profile">Profile</button>
        <button mat-menu-item (click)="logout()">Logout</button>
      </mat-menu>
    </ng-container>

    <ng-template #guestMobile>
      <a href="/auth/login">Login</a>
      <a href="/auth/signup" class="signup">Sign Up</a>
    </ng-template>
  </div>
</header>
