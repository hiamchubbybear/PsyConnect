<div class="toast-container">
  <div
    class="toast"
    *ngFor="let toast of toasts"
    [@toastAnimation]
    [ngStyle]="{
      backgroundColor: toast.bgColor,
      borderColor: toast.accentColor
    }"
  >
    <span class="material-icons icon" [style.color]="toast.accentColor">
      {{ getIcon(toast.type) }}
    </span>
    <div class="content">
      <div class="title" [style.color]="toast.accentColor">
        {{ toast.title }}
      </div>
      <div class="message">{{ toast.message }}</div>
    </div>
    <span class="material-icons close" (click)="removeToast(toast.id)"
      >close</span
    >
  </div>
</div>
