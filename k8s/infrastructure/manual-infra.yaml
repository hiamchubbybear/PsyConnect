# =============================================================================
# PsyConnect Infrastructure - Tối ưu cho VPS giá rẻ (K3s Single Node)
# Kafka KRaft (Không Zookeeper) + Redis giới hạn RAM
# =============================================================================

# --- Redis Service ---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: psyconnect
spec:
  ports:
    - port: 6379
  selector:
    app: redis
---
# --- Redis ConfigMap (Giới hạn RAM) ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: psyconnect
data:
  redis.conf: |
    # Giới hạn tối đa 256MB RAM, tránh tràn bộ nhớ VPS
    maxmemory 256mb
    # Khi đầy, tự động xóa key ít dùng nhất
    maxmemory-policy allkeys-lru
    # Tắt persistence để tiết kiệm disk I/O (cache only)
    save ""
    appendonly no
---
# --- Redis Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: psyconnect
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-config
              mountPath: /usr/local/etc/redis/redis.conf
              subPath: redis.conf
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "300Mi"
              cpu: "200m"
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
---
# --- Kafka Service (KRaft - Không cần Zookeeper) ---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: psyconnect
spec:
  ports:
    - port: 9092
      name: client
  selector:
    app: kafka
---
# --- Kafka KRaft Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: psyconnect
spec:
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          ports:
            - containerPort: 9092
          env:
            # ===== KRaft Mode (Không cần Zookeeper) =====
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"

            # ===== Listener Configuration =====
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"

            # ===== Single Node Replication =====
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"

            # ===== Giới hạn RAM cho Kafka (512MB thay vì mặc định 1GB) =====
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512M -Xms256M"

            # ===== Cluster ID (Bắt buộc cho KRaft) =====
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "500m"
