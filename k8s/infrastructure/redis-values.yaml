# Bitnami Redis Helm Chart Values (Tối ưu cho VPS giá rẻ)
# Repo: https://charts.bitnami.com/bitnami
# Cmd: helm install redis bitnami/redis -n psyconnect -f k8s/infrastructure/redis-values.yaml

auth:
  enabled: false # Dev mode, khi lên Prod nên bật password

image:
  tag: "7-alpine" # Image nhẹ nhất có thể

architecture: standalone # Không cần Sentinel/Cluster cho single node

master:
  persistence:
    enabled: true
    size: 1Gi
  service:
    type: ClusterIP
    port: 6379
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "300Mi"
      cpu: "200m"
  # Cấu hình giới hạn bộ nhớ Redis
  configuration: |
    maxmemory 256mb
    maxmemory-policy allkeys-lru

metrics:
  enabled: false # Tắt metrics để tiết kiệm tài nguyên
