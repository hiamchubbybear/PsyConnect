apiVersion: v1
kind: ConfigMap
metadata:
  name: psyconnect-config
  namespace: psyconnect
data:
  # Common Configuration
  SPRING_PROFILES_ACTIVE: "k8s"

  # Service Discovery / Connectivity
  KAFKA_BROKERS: "kafka-service.psyconnect.svc.cluster.local:9092"
  DB_HOST: "mysql-service.psyconnect.svc.cluster.local"
  DB_PORT: "3306"
  REDIS_HOST: "redis-service.psyconnect.svc.cluster.local"
  REDIS_PORT: "6379"

  # Service URLs (for inter-service communication if needed)
  IDENTITY_SERVICE_URL: "http://identity-service.psyconnect.svc.cluster.local:8080"
  PROFILE_SERVICE_URL: "http://profile-service.psyconnect.svc.cluster.local:8081"
  NOTIFICATION_SERVICE_URL: "http://notification-service.psyconnect.svc.cluster.local:8082"
