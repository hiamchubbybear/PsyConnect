apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: psyconnect
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: api-gateway
          image: hiamchubbybear/psyconnect-api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8888
              hostPort: 8888 # Bind directly to Host IP for Cloudflare Tunnel
          envFrom:
            - configMapRef:
                name: psyconnect-config
            - secretRef:
                name: psyconnect-secrets
          env:
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
