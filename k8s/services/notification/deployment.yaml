apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: psyconnect
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      volumes:
        - name: firebase-credentials
          secret:
            secretName: firebase-credentials
            optional: true
      containers:
        - name: notification-service
          image: hiamchubbybear/psyconnect-notification-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          volumeMounts:
            - name: firebase-credentials
              mountPath: /app/firebase-credentials.json
              subPath: firebase-credentials.json
              readOnly: true
          envFrom:
            - configMapRef:
                name: psyconnect-config
            - secretRef:
                name: psyconnect-secrets
          env:
            - name: SERVICE_PORT
              value: "8082"
            - name: SERVICE_HOST
              value: "0.0.0.0"
            - name: FIREBASE_CREDENTIALS
              value: "/app/firebase-credentials.json"
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
