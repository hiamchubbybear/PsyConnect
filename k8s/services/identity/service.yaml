apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: psyconnect
spec:
  selector:
    app: identity-service
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: grpc
      protocol: TCP
      port: 50051
      targetPort: 50051
  type: ClusterIP
