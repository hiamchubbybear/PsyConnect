apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: psyconnect
  labels:
    app: webapp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: webapp
          image: hiamchubbybear/psyconnect-webapp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              hostPort: 4200 # Bind directly to Host IP for Cloudflare Tunnel
          # Angular app usually serves static files via Nginx inside the container,
          # so config is baked in at build time usually, or injected via main.js replacement.
          # We'll assume standard Nginx container behavior.
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
