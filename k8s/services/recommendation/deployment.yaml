apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: psyconnect
  labels:
    app: recommendation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: recommendation-service
          image: hiamchubbybear/psyconnect-recommendation-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8086
          env:
            - name: PORT
              value: "8086"
            - name: FLASK_ENV
              value: "production"
          livenessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
