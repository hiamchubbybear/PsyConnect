apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-service
  namespace: psyconnect
  labels:
    app: profile-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: profile-service
  template:
    metadata:
      labels:
        app: profile-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: profile-service
          image: hiamchubbybear/psyconnect-profile-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
            - containerPort: 50051
          envFrom:
            - configMapRef:
                name: psyconnect-config
            - secretRef:
                name: psyconnect-secrets
          env:
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -Djava.net.preferIPv4Stack=true"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 120
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
